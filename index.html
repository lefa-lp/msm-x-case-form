<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>症例評価・問診フォーム｜MSMメソッド-X-</title>
<style>
  :root{
    --ink:#22303a;
    --sub:#6b7a86;
    --bg:#f2f5f4;
    --card:#ffffff;
    --accent:#2e6e65;
    --accent2:#3f8f83;
    --danger:#c9564a;
    --line:#e2e8e6;
    --amber:#c98a2e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:40px;
  }
  header{
    text-align:center;
    padding:22px 16px 14px;
  }
  header .sub{font-size:12px;color:var(--sub);letter-spacing:.05em;}
  header h1{font-size:19px;margin:2px 0 0;font-weight:700;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  .progress-outer{
    height:6px;background:#dfe6e4;border-radius:4px;overflow:hidden;margin-bottom:6px;
  }
  .progress-inner{height:100%;background:var(--accent);transition:width .25s;}
  .progress-label{font-size:12px;color:var(--sub);text-align:right;margin-bottom:14px;}

  .card{
    background:var(--card);
    border-radius:16px;
    padding:22px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    margin-bottom:16px;
  }
  .part-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    color:var(--accent);
    background:#e7f1ef;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .section-label{font-size:12px;color:var(--sub);margin-bottom:2px;}
  .q-title{font-size:17px;font-weight:700;line-height:1.5;margin:2px 0 6px;}
  .q-hint{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:14px;white-space:pre-line;}

  textarea{
    width:100%;
    min-height:110px;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    resize:vertical;
    background:#fafcfb;
  }
  textarea:focus{outline:2px solid var(--accent2);border-color:transparent;}

  .input-row{display:flex;gap:8px;align-items:flex-start;}
  .input-row textarea{flex:1;}

  .mic{
    flex-shrink:0;
    width:46px;height:46px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s, transform .1s;
  }
  .mic:active{transform:scale(.94);}
  .mic.rec{background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,86,74,.5);}70%{box-shadow:0 0 0 10px rgba(201,86,74,0);}100%{box-shadow:0 0 0 0 rgba(201,86,74,0);}}
  .mic svg{width:20px;height:20px;}

  .status-line{font-size:12px;color:var(--accent);min-height:16px;margin-top:6px;}

  /* ortho test */
  .ortho-group{margin-bottom:18px;}
  .ortho-group:last-child{margin-bottom:0;}
  .ortho-group-title{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line);}
  .suggest-flag{color:var(--danger);font-size:11px;font-weight:700;margin-left:8px;}
  .ortho-name.suggested,.rom-name.suggested{color:var(--danger);font-weight:700;}
  .ortho-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .ortho-row:last-child{border-bottom:none;}
  .ortho-name-wrap{display:flex;flex-direction:column;flex:1;padding-right:8px;}
  .ortho-name{font-size:13px;line-height:1.4;}
  .ortho-desc{font-size:11px;color:var(--sub);line-height:1.4;margin-top:2px;}
  .ortho-btns{display:flex;gap:6px;flex-shrink:0;}
  .ortho-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--sub);
    font-size:12px;
    font-weight:700;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .ortho-btn.pos.active{background:var(--danger);border-color:var(--danger);color:#fff;}
  .ortho-btn.neg.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* rom */
  .rom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .rom-row:last-child{border-bottom:none;}
  .rom-name{font-size:13px;line-height:1.4;flex:1;}
  .rom-inputs{display:flex;gap:10px;flex-shrink:0;}
  .rom-side{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);}
  .rom-input{
    width:56px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px;
    font-size:14px;
    text-align:center;
    background:#fff;
  }
  .rom-input:focus{outline:2px solid var(--accent2);border-color:transparent;}
  .mmt-input{
    width:56px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px;
    font-size:14px;
    text-align:center;
    background:#fff;
  }
  .mmt-input:focus{outline:2px solid var(--accent2);border-color:transparent;}

  /* progress log */
  .progress-block{margin-bottom:18px;}
  .progress-block:last-child{margin-bottom:0;}
  .progress-block-title{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line);}
  .progress-session{margin-bottom:12px;}
  .progress-session:last-child{margin-bottom:0;}
  .progress-session-title{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:4px;}
  .progress-date{
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    background:#fff;
    margin-bottom:6px;
    width:160px;
  }
  .progress-content{
    width:100%;
    min-height:60px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    resize:vertical;
    background:#fafcfb;
  }
  .progress-content:focus{outline:2px solid var(--accent2);border-color:transparent;}

  /* checklist */
  .checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .check-item{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    background:#fafcfb;
    font-size:13.5px;
    cursor:pointer;
  }
  .check-item input{width:17px;height:17px;accent-color:var(--accent);flex-shrink:0;}
  .check-item.checked{border-color:var(--accent2);background:#eaf4f2;font-weight:600;}
  .checklist-other-label{font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600;}

  /* scale */
  .scale-wrap{margin-bottom:10px;}
  .scale-num{font-size:34px;font-weight:800;color:var(--accent);text-align:center;margin-bottom:4px;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .scale-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px;}

  /* photo */
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .photo-slot{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:10px;
    text-align:center;
    background:#fafcfb;
  }
  .photo-slot label.name{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .photo-slot img{max-width:100%;border-radius:8px;display:block;margin:0 auto 6px;}
  .photo-slot input[type=file]{width:100%;font-size:12px;}
  .photo-clear{font-size:11px;color:var(--danger);background:none;border:none;cursor:pointer;margin-top:4px;text-decoration:underline;}

  /* video */
  .video-group{margin-bottom:16px;}
  .video-group:last-child{margin-bottom:0;}
  .video-group-title{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:8px;}
  .video-grid{display:flex;flex-direction:column;gap:12px;}
  .video-slot{
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:10px;
    text-align:center;
    background:#fafcfb;
  }
  .video-slot label.name{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .video-slot iframe{width:100%;height:160px;border:none;border-radius:8px;display:block;margin-bottom:6px;}
  .video-slot input[type=url]{width:100%;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;}
  .video-link{font-size:12px;word-break:break-all;color:var(--accent);margin:6px 0;display:block;}
  .video-clear{font-size:11px;color:var(--danger);background:none;border:none;cursor:pointer;margin-top:4px;text-decoration:underline;}

  /* nav */
  .nav-row{display:flex;gap:10px;margin-top:4px;}
  .btn{
    flex:1;
    padding:14px 0;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:active{background:var(--accent2);}
  .btn-ghost{background:#eef2f1;color:var(--sub);}
  .btn-skip{background:none;color:var(--sub);text-decoration:underline;font-weight:500;flex:none;padding:14px 6px;}

  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .link-btn{font-size:12.5px;color:var(--sub);background:none;border:none;text-decoration:underline;cursor:pointer;}

  /* summary */
  .sum-part{font-size:13px;font-weight:800;color:var(--accent);margin:20px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--accent);}
  .sum-part:first-child{margin-top:0;}
  .sum-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .sum-q{font-size:12.5px;color:var(--sub);margin-bottom:3px;}
  .sum-a{font-size:14.5px;white-space:pre-line;line-height:1.6;}
  .sum-a.empty{color:#b6bfc2;font-style:italic;}
  .sum-edit{font-size:11.5px;color:var(--accent);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;margin-left:8px;}
  .sum-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .sum-photos img{width:70px;height:70px;object-fit:cover;border-radius:8px;}

  .action-bar{position:sticky;bottom:0;background:linear-gradient(to top, var(--bg) 70%, transparent);padding:14px 0 4px;}
  .copied-msg{text-align:center;font-size:13px;color:var(--accent);font-weight:700;min-height:18px;margin-top:8px;}

  .start-card{text-align:center;padding:30px 22px;}
  .start-card p{font-size:13.5px;color:var(--sub);line-height:1.8;margin:10px 0 20px;}

  .record-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
  .record-row:last-child{border-bottom:none;}
  .record-info{min-width:0;}
  .record-label{font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .record-date{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .record-actions{display:flex;gap:8px;flex-shrink:0;}
  .btn-record-open{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .btn-record-del{background:none;border:none;color:var(--danger);font-size:12px;text-decoration:underline;cursor:pointer;}

  .team-grid{display:flex;flex-direction:column;gap:12px;margin:8px 0 16px;}
  .team-btn{
    padding:18px 0;
    border-radius:14px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
  }
  .team-btn:active{background:var(--accent2);}
  .cloud-note{font-size:12px;color:var(--amber);margin-top:6px;}
  .cloud-note.ok{color:var(--accent);}

  .pass-input{
    width:100%;
    padding:14px 12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:16px;
    text-align:center;
    letter-spacing:.08em;
    margin:4px 0 14px;
  }
  .pass-input:focus{outline:none;border-color:var(--accent);}
  .pass-error{font-size:13px;color:var(--danger);margin:0 0 12px;min-height:18px;}
  .pass-btn{
    width:100%;
    padding:16px 0;
    border-radius:14px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
  }
  .pass-btn:active{background:var(--accent2);}
  .pass-btn[disabled]{opacity:.55;cursor:default;}
  .logout-btn{
    margin-top:14px;
    background:none;
    border:none;
    color:var(--sub);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
  }

  /* 画面外に逃がすのはホスト側。#printArea 自体には position を付けない
     （jsPDFのhtml()は #printArea を複製して別コンテナに入れるため、
       id側にabsolute配置を書くと複製先でも画面外に飛び、PDFが白紙になる） */
  #printHost{
    position:absolute;
    top:0;
    left:-99999px;
    width:820px;
  }
  #printArea{
    width:760px;
    background:#ffffff;
    color:#22303a;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  }
  #printArea h1{font-size:20px;margin:0 0 16px;}
  #printArea h2{font-size:15px;border-bottom:2px solid #333;padding-bottom:4px;margin-top:22px;background:#ffffff;}
  #printArea .pq{font-size:11px;color:#555;margin-top:8px;}
  #printArea .pa{font-size:13px;white-space:pre-line;margin:2px 0 0;}
  #printArea .pimgs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  #printArea .pimgs img{width:120px;border-radius:6px;}
  .export-progress{text-align:center;font-size:12.5px;color:var(--sub);margin-top:6px;min-height:16px;}
</style>
</head>

  <div class="sub">MSMメソッド-X-</div>
  <h1>症例評価・問診フォーム</h1>
</header>

<div class="wrap" id="app"></div>

<div id="printHost"><div id="printArea"></div></div>

/* ---- クラウド保存（チーム共有） ---- */
async function cloudListRecords(team){
  const snap = await db.collection('teams').doc(team).collection('records').orderBy('updatedAt','desc').get();
  return snap.docs.map(d=>({ id: d.id, label: d.data().label || '', updatedAt: d.data().updatedAt || 0 }));
}
async function cloudFetchRecord(team, id){
  const doc = await db.collection('teams').doc(team).collection('records').doc(id).get();
  if(!doc.exists) return null;
  const d = doc.data();
  let state = {};
  try{ state = JSON.parse(d.data || '{}'); }catch(e){}
  return { label: d.label || '', state };
}
async function cloudSaveRecord(team, id, label, stateObj){
  await db.collection('teams').doc(team).collection('records').doc(id).set({
    label: label,
    updatedAt: Date.now(),
    data: JSON.stringify(stateObj)
  });
}
async function cloudDeleteRecord(team, id){
  await db.collection('teams').doc(team).collection('records').doc(id).delete();
}

/* ---- この端末のみの保存（クラウド未設定時のフォールバック、チームごとに別リスト） ---- */
function localIndexKey(team){ return RECORDS_INDEX_KEY + '_' + team; }
function getRecordsIndex(){
  try{
    const raw = localStorage.getItem(localIndexKey(currentTeam));
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveRecordsIndex(list){
  try{ localStorage.setItem(localIndexKey(currentTeam), JSON.stringify(list)); }catch(e){}
}
function migrateLegacyDraftIfNeeded(){
  try{
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if(legacy && getRecordsIndex().length===0){
      const id = 'r' + Date.now();
      localStorage.setItem(RECORD_KEY_PREFIX + id, legacy);
      saveRecordsIndex([{ id, label: '以前の入力', updatedAt: Date.now() }]);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
    }
  }catch(e){}
}
function formatUpdatedAt(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ---- 記録の管理（クラウドが使えればクラウド、なければ端末内） ---- */
async function createNewRecord(label){
  const id = 'r' + Date.now();
  const finalLabel = label || `記録_${todayFileStr()}`;
  currentRecordId = id;
  currentRecordLabel = finalLabel;
  answers = {}; photoData = {}; videoData = {}; orthoTestData = {}; romData = {}; mmtData = {}; progressData = {};
  const stateObj = {answers, photoData, videoData, orthoTestData, romData, mmtData, progressData};
  if(cloudReady){
    try{ await cloudSaveRecord(currentTeam, id, finalLabel, stateObj); }catch(e){ console.error(e); }
  } else {
    const list = getRecordsIndex();
    list.unshift({ id, label: finalLabel, updatedAt: Date.now() });
    saveRecordsIndex(list);
    try{ localStorage.setItem(RECORD_KEY_PREFIX + id, JSON.stringify(stateObj)); }catch(e){}
  }
  return id;
}
async function loadRecord(id){
  if(cloudReady){
    try{
      const rec = await cloudFetchRecord(currentTeam, id);
      if(!rec) return false;
      answers = rec.state.answers || {};
      photoData = rec.state.photoData || {};
      videoData = rec.state.videoData || {};
      orthoTestData = rec.state.orthoTestData || {};
      romData = rec.state.romData || {};
      mmtData = rec.state.mmtData || {};
      progressData = rec.state.progressData || {};
      currentRecordId = id;
      currentRecordLabel = rec.label;
      return true;
    }catch(e){ console.error(e); return false; }
  }
  try{
    const raw = localStorage.getItem(RECORD_KEY_PREFIX + id);
    if(!raw) return false;
    const d = JSON.parse(raw);
    answers = d.answers || {};
    photoData = d.photoData || {};
    videoData = d.videoData || {};
    orthoTestData = d.orthoTestData || {};
    romData = d.romData || {};
    mmtData = d.mmtData || {};
    progressData = d.progressData || {};
    currentRecordId = id;
    const list = getRecordsIndex();
    const rec = list.find(r=>r.id===id);
    currentRecordLabel = rec ? rec.label : '';
    return true;
  }catch(e){ return false; }
}
async function deleteRecord(id){
  if(cloudReady){
    try{ await cloudDeleteRecord(currentTeam, id); }catch(e){ console.error(e); }
  } else {
    localStorage.removeItem(RECORD_KEY_PREFIX + id);
    saveRecordsIndex(getRecordsIndex().filter(r=>r.id!==id));
  }
  if(currentRecordId===id) currentRecordId = null;
}
async function saveDraft(){
  if(!currentRecordId) return;
  const stateObj = {answers, photoData, videoData, orthoTestData, romData, mmtData, progressData};
  if(cloudReady){
    try{ await cloudSaveRecord(currentTeam, currentRecordId, currentRecordLabel, stateObj); }catch(e){ console.error(e); }
  } else {
    try{
      localStorage.setItem(RECORD_KEY_PREFIX + currentRecordId, JSON.stringify(stateObj));
      const list = getRecordsIndex();
      const rec = list.find(r=>r.id===currentRecordId);
      if(rec){ rec.updatedAt = Date.now(); saveRecordsIndex(list); }
    }catch(e){ /* 容量オーバー等は無視 */ }
  }
}
async function clearDraft(){
  if(currentRecordId) await deleteRecord(currentRecordId);
  currentRecordId = null;
  currentRecordLabel = '';
  answers = {};
  photoData = {};
  videoData = {};
  orthoTestData = {};
  romData = {};
  mmtData = {};
  progressData = {};
}

function todayStr(){
  const d = new Date();
  const w = ['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${w}）`;
}

/* ========================= render: 合言葉 ========================= */
/* SDK v8 は、メール列挙保護で導入された新しいサーバー応答
   （INVALID_LOGIN_CREDENTIALS）を認識できず auth/internal-error に丸めてしまい、
   生のJSONを message に入れてきます。そのため code だけでなく本文も見て判定します。 */
function authErrorMessage(err){
  const code = (err && err.code) || '';
  const raw = (err && err.message) || '';
  const has = s => raw.indexOf(s) !== -1;

  if(code === 'auth/wrong-password' || code === 'auth/invalid-credential'
     || code === 'auth/invalid-login-credentials' || code === 'auth/user-not-found'
     || has('INVALID_LOGIN_CREDENTIALS') || has('INVALID_PASSWORD')
     || has('EMAIL_NOT_FOUND') || has('MISSING_PASSWORD') || has('INVALID_EMAIL')){
    return '合言葉が違います。';
  }
  if(code === 'auth/too-many-requests' || has('TOO_MANY_ATTEMPTS')){
    return '試行回数が多すぎます。しばらく時間をおいてからお試しください。';
  }
  if(code === 'auth/network-request-failed'){
    return '通信に失敗しました。電波状況をご確認ください。';
  }
  if(code === 'auth/user-disabled' || has('USER_DISABLED')){
    return 'このアカウントは無効になっています。管理者にご連絡ください。';
  }
  if(code === 'auth/operation-not-allowed' || code === 'auth/configuration-not-found'
     || has('OPERATION_NOT_ALLOWED') || has('CONFIGURATION_NOT_FOUND')){
    return 'ログイン設定が未完了です。管理者にご連絡ください。';
  }
  return `入れませんでした。${code ? '（' + code + '）' : ''}`;
}

function findFirstUnanswered(){
  for(let i=0;i<STEPS.length;i++){
    const s = STEPS[i];
    if(s.type==='photo'){
      if(!PHOTO_SLOTS.every(k=>photoData[k])) return i;
    } else if(s.type==='video'){
      if(!VIDEO_SLOTS.every(k=>videoData[k])) return i;
    } else if(s.type==='scale'){
      if(answers[s.id]===undefined) return i;
    } else if(s.type==='checklist'){
      const arr = answers[s.id];
      if(!((arr && arr.length) || answers[s.id+'_other'])) return i;
    } else if(s.type==='orthotest'){
      if(Object.keys(orthoTestData).length===0) return i;
    } else if(s.type==='rom'){
      if(Object.keys(romData).length===0) return i;
    } else if(s.type==='mmt'){
      if(Object.keys(mmtData).length===0) return i;
    } else if(s.type==='progresslog'){
      if(Object.keys(progressData).length===0) return i;
    } else {
      if(!answers[s.id]) return i;
    }
  }
  return STEPS.length; // すべて回答済み→サマリーへ
}

              <button type="button" class="ortho-btn neg ${status==='negative'?'active':''}" data-key="${escapeHtml(key)}" data-status="negative">陰性</button>
            </div>
          </div>`;

    `;}).join('');
  } else if(s.type==='rom'){

    inputHtml = s.groups.map(g=>{

      <div class="ortho-group">
        <div class="ortho-group-title">${g.group}${isSuggested?'<span class="suggest-flag">⚠ 所見あり・実施推奨</span>':''}</div>
        ${g.items.map(item=>{
          if(item.bilateral){

            const lKey = `${g.group}::${item.name}::L`;
            return `
            <div class="rom-row">
              <span class="rom-name ${isSuggested?'suggested':''}">${escapeHtml(item.name)}</span>
              <div class="rom-inputs">
                <label class="rom-side">右 <input type="number" class="rom-input" data-key="${escapeHtml(rKey)}" value="${romData[rKey]!==undefined?romData[rKey]:''}" placeholder="-">°</label>
                <label class="rom-side">左 <input type="number" class="rom-input" data-key="${escapeHtml(lKey)}" value="${romData[lKey]!==undefined?romData[lKey]:''}" placeholder="-">°</label>
              </div>
            </div>`;
          }
          const key = `${g.group}::${item.name}`;
          return `
          <div class="rom-row">
            <span class="rom-name ${isSuggested?'suggested':''}">${escapeHtml(item.name)}</span>
            <div class="rom-inputs">

            </div>

      <div class="ortho-group">
        <div class="ortho-group-title">${g.group}${isSuggested?'<span class="suggest-flag">⚠ 所見あり・実施推奨</span>':''}</div>
        ${g.muscles.map(m=>{
          const rKey = `${g.group}::${m}::R`;
          const lKey = `${g.group}::${m}::L`;
          return `
          <div class="rom-row">
            <span class="rom-name ${isSuggested?'suggested':''}">${escapeHtml(m)}</span>
            <div class="rom-inputs">
              <label class="rom-side">右 <input type="number" class="mmt-input" min="0" max="5" step="1" data-key="${escapeHtml(rKey)}" value="${mmtData[rKey]!==undefined?mmtData[rKey]:''}" placeholder="-">/5</label>
              <label class="rom-side">左 <input type="number" class="mmt-input" min="0" max="5" step="1" data-key="${escapeHtml(lKey)}" value="${mmtData[lKey]!==undefined?mmtData[lKey]:''}" placeholder="-">/5</label>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;}).join('');
  } else if(s.type==='progresslog'){
    inputHtml = s.groups.map(g=>`
      <div class="progress-block">
        <div class="progress-block-title">${escapeHtml(g.label)}</div>
        ${g.sessions.map(n=>{
          const entry = progressData[n] || {};
          return `
          <div class="progress-session">
            <div class="progress-session-title">${n}回目</div>
            <input type="date" class="progress-date" data-key="${n}" value="${entry.date||''}">
            <textarea class="progress-content" data-key="${n}" placeholder="実施内容・変化点・次回への申し送りなど">${escapeHtml(entry.content||'')}</textarea>
          </div>`;
        }).join('')}

    `).join('');
  } else if(s.type==='scale'){

    const note = answers[s.id+'_note'] || '';

      <div class="scale-wrap">
        <div class="scale-num" id="scaleNum">${val}</div>
        <input type="range" id="scaleRange" min="0" max="10" step="1" value="${val}">
        <div class="scale-legend"><span>0</span><span>10</span></div>

      <div class="q-hint" style="margin-top:10px;margin-bottom:6px;">${escapeHtml(s.noteHint||'')}</div>
      <div class="input-row">
        <textarea id="ansNote" placeholder="状況メモ（任意）">${escapeHtml(note)}</textarea>
        <button class="mic" id="micBtn" type="button" aria-label="音声入力">${micIcon()}</button>
      </div>
      <div class="status-line" id="statusLine"></div>

          ${photoData[key] ? `<img src="${photoData[key]}"><button class="photo-clear" data-key="${key}">削除</button>` : `<input type="file" accept="image/*" data-key="${key}">`}

            <div class="video-slot">
              <label class="name">${slotLabel}</label>
              ${url ? `
                ${embed ? `<iframe src="${embed}" allowfullscreen></iframe>` : ''}

                <button class="video-clear" data-key="${key}">削除</button>

            </div>`;

        </div>
      </div>
    `).join('');
  }

  app.innerHTML = `
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    <div class="progress-label">${idx+1} / ${STEPS.length}</div>
    <div class="card">
      <div class="meta-row">
        <span class="part-tag">${s.part}</span>
        <span>
          <button class="link-btn" id="toRecordList" style="margin-right:10px;">記録一覧へ</button>

      </div>

    autoFillBtn.addEventListener('click', ()=>{

  if(s.type==='orthotest'){

      btn.addEventListener('click', ()=>{
        const key = btn.dataset.key;
        const status = btn.dataset.status;
        if(orthoTestData[key] === status){
          delete orthoTestData[key];
        } else {
          orthoTestData[key] = status;
        }
        saveDraft();
        renderStep();
      });
    });
  }
  if(s.type==='photo'){
    PHOTO_SLOTS.forEach(key=>{
      const inp = app.querySelector(`input[type=file][data-key="${key}"]`);
      if(inp){
        inp.addEventListener('change', (e)=>{
          const file = e.target.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = ()=>{ photoData[key] = reader.result; saveDraft(); renderStep(); };
          reader.readAsDataURL(file);
        });
      }
    });
    app.querySelectorAll('.photo-clear').forEach(btn=>{
      btn.addEventListener('click', ()=>{ delete photoData[btn.dataset.key]; saveDraft(); renderStep(); });
    });

  if(s.type==='video'){

      const inp = app.querySelector(`input[type=url][data-key="${key}"]`);
      if(inp){
        const commit = ()=>{
          const v = inp.value.trim();
          if(v){ videoData[key] = v; saveDraft(); renderStep(); }
        };
        inp.addEventListener('change', commit);
        inp.addEventListener('blur', commit);
      }
    });
    app.querySelectorAll('.video-clear').forEach(btn=>{
      btn.addEventListener('click', ()=>{ delete videoData[btn.dataset.key]; saveDraft(); renderStep(); });
    });
  }

  setupMic(s);
}

function commitStep(s){
  if(s.type==='text'){
    const el = document.getElementById('ans');
    if(el) answers[s.id] = el.value.trim();
  } else if(s.type==='scale'){
    const r = document.getElementById('scaleRange');
    if(r) answers[s.id] = parseInt(r.value,10);
    const n = document.getElementById('ansNote');
    if(n) answers[s.id+'_note'] = n.value.trim();
  } else if(s.type==='checklist'){
    const boxes = app.querySelectorAll('.check-item input[type=checkbox]');
    if(boxes.length){
      const checked = [];
      boxes.forEach(cb=>{ if(cb.checked) checked.push(s.options[parseInt(cb.dataset.checkIdx,10)]); });
      answers[s.id] = checked;
    }
    const other = document.getElementById('ansOther');
    if(other) answers[s.id+'_other'] = other.value.trim();
  } else if(s.type==='rom'){
    app.querySelectorAll('.rom-input').forEach(inp=>{
      const key = inp.dataset.key;
      const v = inp.value.trim();
      if(v==='') delete romData[key]; else romData[key] = v;
    });
  } else if(s.type==='mmt'){
    app.querySelectorAll('.mmt-input').forEach(inp=>{
      const key = inp.dataset.key;
      const v = inp.value.trim();
      if(v==='') delete mmtData[key]; else mmtData[key] = v;
    });
  } else if(s.type==='progresslog'){
    app.querySelectorAll('.progress-session').forEach(row=>{
      const dateInp = row.querySelector('.progress-date');
      const contentInp = row.querySelector('.progress-content');
      const key = dateInp.dataset.key;
      const date = dateInp.value.trim();
      const content = contentInp.value.trim();
      if(!date && !content){ delete progressData[key]; }
      else { progressData[key] = {date, content}; }
    });
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getProgressResultLines(s){
  const lines = [];
  s.groups.forEach(g=>{
    g.sessions.forEach(n=>{
      const entry = progressData[n];
      if(entry && (entry.date || entry.content)){
        lines.push(`${n}回目（${entry.date||'日付未記入'}）：${entry.content||'（内容未記入）'}`);
      }
    });
  });
  return lines;
}

function getMmtResultLines(s){
  const lines = [];
  s.groups.forEach(g=>{
    g.muscles.forEach(m=>{
      const rKey = `${g.group}::${m}::R`;
      const lKey = `${g.group}::${m}::L`;
      if(mmtData[rKey]!==undefined && mmtData[rKey]!=='') lines.push(`${g.group}｜${m}（右）：${mmtData[rKey]}/5`);
      if(mmtData[lKey]!==undefined && mmtData[lKey]!=='') lines.push(`${g.group}｜${m}（左）：${mmtData[lKey]}/5`);
    });
  });
  return lines;
}

function getRomResultLines(s){
  const lines = [];
  s.groups.forEach(g=>{
    g.items.forEach(item=>{
      if(item.bilateral){
        const rKey = `${g.group}::${item.name}::R`;
        const lKey = `${g.group}::${item.name}::L`;
        if(romData[rKey]!==undefined && romData[rKey]!=='') lines.push(`${g.group}｜${item.name}（右）：${romData[rKey]}°`);
        if(romData[lKey]!==undefined && romData[lKey]!=='') lines.push(`${g.group}｜${item.name}（左）：${romData[lKey]}°`);
      } else {
        const key = `${g.group}::${item.name}`;
        if(romData[key]!==undefined && romData[key]!=='') lines.push(`${g.group}｜${item.name}：${romData[key]}°`);
      }
    });
  });
  return lines;
}

function getOrthoResultLines(s){
  const lines = [];
  s.groups.forEach(g=>{
    g.tests.forEach(t=>{
      const key = `${g.group}::${t.name}`;
      const status = orthoTestData[key];
      if(status) lines.push(`${g.group}｜${t.name}：${status==='positive'?'陽性':'陰性'}`);
    });
  });
  return lines;
}

function getDisplayValue(s){
  if(s.type==='scale'){
    return answers[s.id]!==undefined ? `${answers[s.id]} / 10${answers[s.id+'_note']?'　'+answers[s.id+'_note']:''}` : '';

  if(s.type==='checklist'){
    const checked = answers[s.id] || [];
    const other = answers[s.id+'_other'] || '';
    const parts = [...checked];
    if(other) parts.push(`その他：${other}`);

  }

}

/* ========================= 音声入力 ========================= */
function setupMic(step){
  const micBtn = document.getElementById('micBtn');
  if(!micBtn) return;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    micBtn.style.opacity = '.35';
    micBtn.title = 'このブラウザは音声入力に対応していません';
    return;
  }
  let rec;
  micBtn.addEventListener('click', ()=>{
    const targetId = step.type==='scale' ? 'ansNote' : (step.type==='checklist' ? 'ansOther' : 'ans');
    const target = document.getElementById(targetId);
    const status = document.getElementById('statusLine');
    if(recognizing){ if(rec) rec.stop(); return; }
    rec = new SpeechRecognition();
    rec.lang = 'ja-JP';
    rec.interimResults = true;
    rec.continuous = true;
    let finalText = target.value ? target.value + ' ' : '';
    rec.onstart = ()=>{ recognizing = true; micBtn.classList.add('rec'); status.textContent = '録音中…もう一度タップで停止'; };
    rec.onresult = (e)=>{
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal){ finalText += t; } else { interim += t; }
      }
      target.value = finalText + interim;
    };
    rec.onerror = ()=>{ status.textContent = 'うまく聞き取れませんでした。もう一度お試しください'; };
    rec.onend = ()=>{ recognizing = false; micBtn.classList.remove('rec'); if(status.textContent.startsWith('録音中')) status.textContent = ''; target.value = finalText.trim(); };
    rec.start();
  });
}

function buildReportText(){
  let lastPart = null;
  let lines = [`【症例評価・問診】MSMメソッド-X-`];
  STEPS.forEach(s=>{
    if(s.part !== lastPart){ lines.push(''); lines.push(`■ ${s.part}`); lastPart = s.part; }
    if(s.type==='photo'){
      const n = PHOTO_SLOTS.filter(k=>photoData[k]).length;
      lines.push(`・${s.title}：写真${n}枚（コピーには含まれません／印刷・PDF保存でご確認ください）`);
      return;
    }
    if(s.type==='video'){
      const found = VIDEO_SLOTS.filter(k=>videoData[k]);
      if(found.length){
        lines.push(`・${s.title}：`);
        found.forEach(k=>lines.push(`　- ${VIDEO_SLOT_LABELS[k]}：${videoData[k]}`));
      }
      return;
    }
    if(s.type==='orthotest'){
      const orthoLines = getOrthoResultLines(s);
      if(orthoLines.length){
        lines.push(`・${s.title}：`);
        orthoLines.forEach(l=>lines.push(`　- ${l}`));
      }
      return;
    }
    if(s.type==='rom'){
      const romLines = getRomResultLines(s);
      if(romLines.length){
        lines.push(`・${s.title}：`);
        romLines.forEach(l=>lines.push(`　- ${l}`));
      }
      return;
    }
    if(s.type==='mmt'){
      const mmtLines = getMmtResultLines(s);
      if(mmtLines.length){
        lines.push(`・${s.title}：`);
        mmtLines.forEach(l=>lines.push(`　- ${l}`));
      }
      return;
    }
    if(s.type==='progresslog'){
      const progLines = getProgressResultLines(s);
      if(progLines.length){
        lines.push(`・${s.title}：`);
        progLines.forEach(l=>lines.push(`　- ${l}`));
      }
      return;
    }
    const val = getDisplayValue(s);
    if(val) lines.push(`・${s.title}：${val}`);
  });
  return lines.join('\n');
}

function copyReport(){
  const text = buildReportText();
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('copiedMsg').textContent = 'コピーしました！LINE等に貼り付けてください';
    setTimeout(()=>{ const m=document.getElementById('copiedMsg'); if(m) m.textContent=''; }, 3000);
  }).catch(()=>{
    prompt('以下を長押しコピーしてください', text);
  });
}

function buildPrintAreaHtml(){
  let lastPart = null;
  let html = `<h1>症例評価・問診　MSMメソッド-X-</h1>`;
  STEPS.forEach(s=>{
    if(s.part !== lastPart){ html += `<h2>${s.part}</h2>`; lastPart = s.part; }
    if(s.type==='photo'){
      const imgs = PHOTO_SLOTS.filter(k=>photoData[k]);
      html += `<div class="pq">${s.section}｜${s.title}</div>`;
      if(imgs.length){
        html += `<div class="pimgs">${imgs.map(k=>`<img src="${photoData[k]}">`).join('')}</div>`;
      } else {
        html += `<div class="pa">未入力</div>`;
      }
      return;
    }
    if(s.type==='video'){
      const vids = VIDEO_SLOTS.filter(k=>videoData[k]);
      html += `<div class="pq">${s.section}｜${s.title}</div>`;
      html += `<div class="pa">${vids.length ? vids.map(k=>`${VIDEO_SLOT_LABELS[k]}：${escapeHtml(videoData[k])}`).join('\n') : '未入力'}</div>`;
      return;
    }
    if(s.type==='orthotest'){
      const orthoLines = getOrthoResultLines(s);
      html += `<div class="pq">${s.section}｜${s.title}</div>`;
      html += `<div class="pa">${orthoLines.length ? orthoLines.map(escapeHtml).join('\n') : '未入力'}</div>`;
      return;
    }
    if(s.type==='rom'){
      const romLines = getRomResultLines(s);
      html += `<div class="pq">${s.section}｜${s.title}</div>`;
      html += `<div class="pa">${romLines.length ? romLines.map(escapeHtml).join('\n') : '未入力'}</div>`;
      return;
    }
    if(s.type==='mmt'){
      const mmtLines = getMmtResultLines(s);
      html += `<div class="pq">${s.section}｜${s.title}</div>`;
      html += `<div class="pa">${mmtLines.length ? mmtLines.map(escapeHtml).join('\n') : '未入力'}</div>`;
      return;
    }
    if(s.type==='progresslog'){
      const progLines = getProgressResultLines(s);
      html += `<div class="pq">${s.section}｜${s.title}</div>`;
      html += `<div class="pa">${progLines.length ? progLines.map(escapeHtml).join('\n') : '未入力'}</div>`;
      return;
    }
    const val = getDisplayValue(s);
    html += `<div class="pq">${s.section}｜${s.title}</div><div class="pa">${val ? escapeHtml(val) : '未入力'}</div>`;
  });
  document.getElementById('printArea').innerHTML = html;
}

function todayFileStr(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function setExportMsg(text){
  const el = document.getElementById('exportMsg');
  if(el) el.textContent = text;
}

/* ========================= PDF出力（背景白・全ページ右下にロゴ） ========================= */
function exportPDF(){
  if(!window.jspdf || !window.html2canvas){
    alert('PDF生成ライブラリの読み込みに失敗しました。ネット接続をご確認のうえ、公開後のURLでお試しください。');
    return;
  }
  setExportMsg('PDFを作成中…');
  buildPrintAreaHtml();
  const element = document.getElementById('printArea');
  const { jsPDF } = window.jspdf;

  /* jsPDFのdoc.html()はテキストを内蔵欧文フォントで描画するため日本語が文字化けする。
     html2canvasでページ全体を画像化し、A4サイズに切り分けて貼る方式にする。 */
  const srcW = element.offsetWidth || 760;
  const srcH = element.scrollHeight;
  const MAX_AREA = 12000000; // iOS Safariのcanvas上限対策
  let scale = 2;
  if(srcW * srcH * scale * scale > MAX_AREA){
    scale = Math.max(1, Math.sqrt(MAX_AREA / (srcW * srcH)));
  }

  html2canvas(element, {
    scale: scale,
    backgroundColor: '#ffffff',
    useCORS: true,
    windowWidth: srcW,
    scrollX: 0,
    scrollY: 0
  }).then(canvas=>{
    const doc = new jsPDF('p','pt','a4');
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const logoW = 90;
    const logoH = logoW * LOGO_ASPECT;
    const margin = 24;
    const contentW = pageW - margin * 2;
    const contentTop = margin;
    const contentH = pageH - margin - (logoH + 32); // 下部のロゴ帯を空ける

    const pxPerPt = canvas.width / contentW;          // 画像1pt当たりのピクセル数
    const slicePx = Math.max(1, Math.floor(contentH * pxPerPt));

    const wmW = pageW * 0.62;
    const wmH = wmW * WATERMARK_ASPECT;
    const slice = document.createElement('canvas');
    const sctx = slice.getContext('2d');
    const srcCtx = canvas.getContext('2d');

    /* 行の途中で改ページされないよう、切れ目の少し手前にある
       「横一列すべて白」の位置を探してそこで切る */
    function sliceHeightAt(startY){
      const rest = canvas.height - startY;
      if(rest <= slicePx) return rest;
      const bandH = Math.floor(slicePx * 0.15);
      const bandTop = startY + slicePx - bandH;
      let data;
      try{
        data = srcCtx.getImageData(0, bandTop, canvas.width, bandH).data;
      }catch(e){
        return slicePx;
      }
      for(let y = bandH - 1; y >= 0; y--){
        let blank = true;
        for(let x = 0; x < canvas.width; x += 3){
          const i = (y * canvas.width + x) * 4;
          if(data[i] < 245 || data[i+1] < 245 || data[i+2] < 245){ blank = false; break; }
        }
        if(blank) return (bandTop + y) - startY;
      }
      return slicePx;
    }

    let sy = 0;
    let first = true;
    while(sy < canvas.height){
      if(!first) doc.addPage();
      first = false;

      // 背景（透過部分が黒くならないよう白で塗る）
      doc.setFillColor(255,255,255);
      doc.rect(0, 0, pageW, pageH, 'F');

      const sh = sliceHeightAt(sy);
      slice.width = canvas.width;
      slice.height = sh;
      sctx.fillStyle = '#ffffff';
      sctx.fillRect(0, 0, slice.width, slice.height);
      sctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);

      doc.addImage(
        slice.toDataURL('image/jpeg', 0.92), 'JPEG',
        margin, contentTop, contentW, sh / pxPerPt,
        undefined, 'FAST'
      );

      // 透かしは本文画像が不透明なため、上から薄く重ねる
      if(doc.setGState && doc.GState){
        doc.saveGraphicsState();
        doc.setGState(new doc.GState({ opacity: 0.10 }));
        doc.addImage(WATERMARK_DATA_URI, 'PNG', (pageW - wmW)/2, (pageH - wmH)/2, wmW, wmH);
        doc.restoreGraphicsState();
      }

      doc.addImage(LOGO_DATA_URI, 'PNG', pageW - logoW - margin, pageH - logoH - 20, logoW, logoH);
      sy += sh;
    }

    doc.save(`症例評価問診_${todayFileStr()}.pdf`);
    setExportMsg('PDFを保存しました');
    setTimeout(()=>setExportMsg(''), 3000);
  }).catch(err=>{
    console.error(err);
    setExportMsg('');
    alert('PDFの作成に失敗しました。時間をおいて再度お試しください。');
  });
}

/* ========================= PowerPoint出力（背景白・全スライドに透かし＋右下にロゴ） ========================= */
/* 背景の透かし。文字より先に置くことで必ず最背面になる */
function newPptxSlide(pptx){
  const slide = pptx.addSlide();
  slide.background = { color:'FFFFFF' };
  const wmW = 6.4;
  const wmH = wmW * PPTX_WM_ASPECT;
  slide.addImage({
    data: PPTX_WM_DATA_URI,
    x: (10 - wmW)/2, y: (5.625 - wmH)/2, w: wmW, h: wmH,
    transparency: 90
  });
  return slide;
}

function addPptxLogo(slide){
  slide.addImage({ data: LOGO_DATA_URI, x: 8.5, y: 5.25, w: 1.2, h: 1.2*LOGO_ASPECT });
}

function addPptxBulletSlide(pptx, title, lines){
  const chunkSize = 20;
  const chunks = [];
  for(let i=0;i<lines.length;i+=chunkSize){ chunks.push(lines.slice(i,i+chunkSize)); }
  if(chunks.length===0) chunks.push([]);
  chunks.forEach((chunk, ci)=>{
    const slide = newPptxSlide(pptx);
    const titleText = chunks.length>1 ? `${title}（${ci+1}/${chunks.length}）` : title;
    slide.addText(titleText, { x:0.4, y:0.25, w:9.2, h:0.5, fontSize:18, bold:true, color:'2E6E65' });
    if(chunk.length){
      slide.addText(chunk.map(l=>({ text: l, options:{ bullet:true, breakLine:true } })), { x:0.5, y:0.9, w:9, h:4.3, fontSize:12, color:'22303A', valign:'top' });
    } else {
      slide.addText('未入力', { x:0.5, y:0.9, w:9, h:0.5, fontSize:12, color:'999999', italic:true });
    }
    addPptxLogo(slide);
  });
}

function exportPPTX(){
  if(!window.PptxGenJS){
    alert('PowerPoint生成ライブラリの読み込みに失敗しました。ネット接続をご確認のうえ、公開後のURLでお試しください。');
    return;
  }
  setExportMsg('PowerPointを作成中…');
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_16x9';

  const cover = newPptxSlide(pptx);
  cover.addText('症例評価・問診', { x:0.5, y:1.9, w:9, h:1, fontSize:32, bold:true, color:'22303A', align:'center' });
  cover.addText('MSMメソッド-X-', { x:0.5, y:2.8, w:9, h:0.6, fontSize:16, color:'6B7A86', align:'center' });
  if(answers.date) cover.addText(answers.date, { x:0.5, y:3.3, w:9, h:0.5, fontSize:12, color:'6B7A86', align:'center' });
  addPptxLogo(cover);

  let lastSection = null;
  let sectionLines = [];
  let sectionTitle = '';

  function flush(){
    if(sectionTitle) addPptxBulletSlide(pptx, sectionTitle, sectionLines);
    sectionLines = [];
    sectionTitle = '';
  }

  STEPS.forEach(s=>{
    if(s.type==='photo'){
      flush();
      lastSection = null;
      const found = PHOTO_SLOTS.filter(k=>photoData[k]);
      const slide = newPptxSlide(pptx);
      slide.addText(s.section, { x:0.4, y:0.25, w:9.2, h:0.5, fontSize:18, bold:true, color:'2E6E65' });
      if(found.length){
        const positions = [{x:0.5,y:0.9},{x:5.1,y:0.9},{x:0.5,y:3.15},{x:5.1,y:3.15}];
        found.slice(0,4).forEach((k,idx)=>{
          slide.addImage({ data: photoData[k], x:positions[idx].x, y:positions[idx].y, w:4.3, h:2.1, sizing:{ type:'contain', w:4.3, h:2.1 } });
          slide.addText(k, { x:positions[idx].x, y:positions[idx].y+2.15, w:4.3, h:0.3, fontSize:10, color:'6B7A86' });
        });
      } else {
        slide.addText('未入力', { x:0.5, y:0.9, w:9, h:0.5, fontSize:12, color:'999999', italic:true });
      }
      addPptxLogo(slide);
      return;
    }

    if(s.section !== lastSection){
      flush();
      lastSection = s.section;
      sectionTitle = s.section;
    }

    if(s.type==='video'){
      const found = VIDEO_SLOTS.filter(k=>videoData[k]);
      if(found.length){
        sectionLines.push(s.title);
        found.forEach(k=>sectionLines.push(`　${VIDEO_SLOT_LABELS[k]}：${videoData[k]}`));
      }
      return;
    }
    if(s.type==='orthotest'){ sectionLines.push(...getOrthoResultLines(s)); return; }
    if(s.type==='rom'){ sectionLines.push(...getRomResultLines(s)); return; }
    if(s.type==='mmt'){ sectionLines.push(...getMmtResultLines(s)); return; }
    if(s.type==='progresslog'){ sectionLines.push(...getProgressResultLines(s)); return; }
    const val = getDisplayValue(s);
    if(val) sectionLines.push(`${s.title}：${val}`);
  });
  flush();

  pptx.writeFile({ fileName: `症例評価問診_${todayFileStr()}.pptx` }).then(()=>{
    setExportMsg('PowerPointを保存しました');
    setTimeout(()=>setExportMsg(''), 3000);
  }).catch(err=>{
    console.error(err);
    setExportMsg('');
    alert('PowerPointの作成に失敗しました。時間をおいて再度お試しください。');
  });
}

function boot(){
  /* クラウド未設定時は従来どおり端末内保存で動作（合言葉なし） */
  if(!cloudReady){ renderTeamSelect(); return; }

  app.innerHTML = `<div class="card start-card"><p>読み込み中…</p></div>`;

  let signedInRendered = false;
  auth.onAuthStateChanged(user=>{
    if(user){
      if(signedInRendered) return;
      signedInRendered = true;
      renderTeamSelect();
    }else{
      signedInRendered = false;
      currentTeam = null;
      currentRecordId = null;
      currentRecordLabel = '';
      idx = -1;
      answers = {}; photoData = {}; videoData = {}; orthoTestData = {}; romData = {}; mmtData = {}; progressData = {};
      renderPassGate();
    }
  });
}
boot();
